<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230969da' stroke-width='1.6' stroke-linejoin='round'%3E%3Cpath d='M12 2 3 7v10l9 5 9-5V7z'/%3E%3Cpath d='M3 7l9 5 9-5M12 12v10'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
    <div><h1>Cluster dashboard</h1><p id="subtitle" class="muted">Loading…</p></div>
  </div>
  <div class="top-actions">
    <span id="updated" class="muted" aria-live="polite"></span>
    <label class="switch"><input type="checkbox" id="auto" checked><span>Auto-refresh</span></label>
    <button id="refresh" class="btn" type="button" title="Refresh now"><svg class="icon" id="refresh-icon" viewBox="0 0 24 24"></svg><span>Refresh</span></button>
  </div>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<main id="app" aria-busy="true">
  <section id="kpis" class="kpis" aria-label="Summary"></section>

  <div class="grid">
    <section class="panel span-4" aria-labelledby="h-capacity">
      <h2 id="h-capacity">Capacity <small class="muted">requested vs allocatable</small></h2>
      <div id="capacity"></div>
      <div id="version"></div>
    </section>
    <section class="panel span-8" aria-labelledby="h-charts">
      <h2 id="h-charts">Last hour</h2>
      <div id="charts" class="charts"></div>
    </section>

    <section class="panel span-7" aria-labelledby="h-problems">
      <h2 id="h-problems">Needs attention <span id="problem-count" class="count"></span></h2>
      <div id="problems"></div>
    </section>
    <section class="panel span-5" aria-labelledby="h-events">
      <h2 id="h-events">Recent warnings</h2>
      <div id="events"></div>
    </section>

    <section class="panel span-12" aria-labelledby="h-ns">
      <div class="panel-head">
        <h2 id="h-ns">Namespaces</h2>
        <div class="tools">
          <label class="switch"><input type="checkbox" id="only-problems"><span>Only with problems</span></label>
          <input id="ns-filter" class="input" type="search" placeholder="Filter namespaces" aria-label="Filter namespaces">
        </div>
      </div>
      <div id="namespaces" class="tiles"></div>
    </section>

    <section class="panel span-12" aria-labelledby="h-nodes">
      <h2 id="h-nodes">Nodes</h2>
      <div class="table-wrap"><table id="nodes"></table></div>
    </section>

    <section class="panel span-12" aria-labelledby="h-apps">
      <h2 id="h-apps">Argo CD applications</h2>
      <div class="table-wrap"><table id="apps"></table></div>
    </section>
  </div>
</main>

<div id="scrim" class="scrim" hidden></div>

<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <header class="drawer-head">
    <div><p class="muted">Namespace</p><h2 id="drawer-title"></h2></div>
    <div class="drawer-actions">
      <button id="drawer-diagnose" class="btn primary" type="button"></button>
      <button id="drawer-close" class="btn icon-btn" type="button" aria-label="Close"></button>
    </div>
  </header>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<aside id="assistant" class="drawer wide" role="dialog" aria-modal="true" aria-labelledby="assistant-title" hidden>
  <header class="drawer-head">
    <div><p class="muted">Assistant · read-only</p><h2 id="assistant-title"></h2></div>
    <button id="assistant-close" class="btn icon-btn" type="button" aria-label="Close"></button>
  </header>
  <div class="drawer-body">
    <label for="question" class="label">What are you seeing? <span class="muted">(optional)</span></label>
    <textarea id="question" class="input" rows="2" maxlength="1000" placeholder="e.g. It started failing after the last deploy"></textarea>
    <div class="row">
      <button id="run" class="btn primary" type="button"></button>
      <button id="stop" class="btn" type="button" hidden>Stop</button>
      <span class="muted small">Reads pods, events, logs, objects and metrics. It can't change anything. Each run uses the Claude API.</span>
    </div>
    <ol id="timeline" class="timeline" aria-live="polite"></ol>
    <div id="answer" class="answer" aria-live="polite"></div>
    <p id="usage" class="muted small"></p>
  </div>
</aside>
</body>
</html>
