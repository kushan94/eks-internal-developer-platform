# The only resource applied by hand. REPO_URL, AWS_ENABLED and AWS_ACCOUNT_ID are filled in by `make gitops`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: HEAD
    path: gitops/root
    helm:
      parameters:
        - name: repoURL
          value: REPO_URL
        - name: aws.enabled
          value: "AWS_ENABLED"
        - name: awsAccountId
          value: "AWS_ACCOUNT_ID"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
