repoURL: ""
targetRevision: HEAD
crossplaneChartVersion: 2.4.3

# Installed first by the Cluster workflow (make platform-bootstrap), then kept
# up to date by Argo CD. The Makefile reads these versions from here.
argocd:
  chartVersion: 10.11.6
externalSecrets:
  chartVersion: 2.14.0

aws:
  # Installs the Crossplane AWS providers. Needs AWS credentials, so it is off for local clusters.
  enabled: false

# GitHub account whose repos teams can deploy from.
githubOwner: kushan94

# Public URLs, used when aws.enabled is true.
clusterName: idp
region: eu-north-1
domain: idp.skyforgelab.cloud

# GitHub users who can sign in to Grafana on EKS, as admins.
grafanaAdmins:
  - kushan94

# Set by `make gitops` on EKS, so the account ID stays out of Git.
awsAccountId: ""

# The production profile: more replicas of platform components. Set by
# `make gitops` from Terraform's profile on EKS; off on kind.
highAvailability: false

backstage:
  # Written by the Backstage image workflow after each build. Empty until the
  # first build, which keeps Backstage out of the cluster until there's an image.
  imageTag: "52c8920b44cae7f89409bce4e054961f8d23c606"
