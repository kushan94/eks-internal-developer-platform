apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webservice-api
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/crossplane/webservice
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Crossplane installs these CRDs after startup, so they may not exist yet.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
