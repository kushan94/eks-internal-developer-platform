{{- if and .Values.aws.enabled .Values.backstage.imageTag }}
# Backstage, from the image CI builds into ECR. The registry address includes
# the AWS account ID, so it comes from the root app's awsAccountId parameter
# rather than from Git. Skipped until CI has built a first image.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.10.2
    helm:
      valuesObject:
        backstage:
          replicas: {{ ternary 2 1 .Values.highAvailability }}
          image:
            registry: {{ required "awsAccountId is required for Backstage" .Values.awsAccountId }}.dkr.ecr.{{ .Values.region }}.amazonaws.com
            repository: idp/backstage
            tag: {{ .Values.backstage.imageTag | quote }}
          args: ["--config", "app-config.yaml", "--config", "app-config.production.yaml"]
          # Replicas start one at a time, through files/backstage-start.js. Two starting
          # against the session's new database corrupted a migration lock table, and
          # Backstage was never ready while nothing restarted it. See ADR 0028.
          command: ["node", "/launcher/start.js", "node", "packages/backend"]
          extraEnvVars:
            - name: NODE_PATH
              value: /app/node_modules
            # The public URL comes from the root application's domain, so it isn't in the image.
            - name: BACKSTAGE_BASE_URL
              value: https://backstage.{{ .Values.domain }}
          extraVolumes:
            - name: launcher
              configMap:
                name: backstage-start
          extraVolumeMounts:
            - name: launcher
              mountPath: /launcher
              readOnly: true
          # backstage-argocd is created by `make argocd-backstage-token`.
          extraEnvVarsSecrets: [backstage-github-app, backstage-database, backstage-argocd]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
        # The Kubernetes plugin reads the cluster with this account.
        serviceAccount:
          create: true
          name: backstage
        httpRoute:
          enabled: true
          parentRefs:
            - name: platform
              namespace: gateway-system
              sectionName: https
          hostnames: [backstage.{{ .Values.domain }}]
        extraDeploy:
          # The launcher, from gitops/root/files/. It must not contain two opening
          # braces in a row: this chart renders it once and the Backstage chart again.
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: backstage-start
            data:
              start.js: |
{{ .Files.Get "files/backstage-start.js" | indent 16 }}
          # Read-only access for the Kubernetes plugin. Leaves out ConfigMaps
          # and Secrets, which can hold settings people shouldn't browse.
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backstage-kubernetes-read
            rules:
              - apiGroups: [""]
                resources: [pods, pods/log, services, limitranges, resourcequotas]
                verbs: [get, list, watch]
              - apiGroups: [apps]
                resources: [deployments, replicasets, statefulsets, daemonsets]
                verbs: [get, list, watch]
              - apiGroups: [autoscaling]
                resources: [horizontalpodautoscalers]
                verbs: [get, list, watch]
              - apiGroups: [networking.k8s.io]
                resources: [ingresses]
                verbs: [get, list, watch]
              - apiGroups: [batch]
                resources: [jobs, cronjobs]
                verbs: [get, list, watch]
              - apiGroups: [metrics.k8s.io]
                resources: [pods]
                verbs: [get, list]
              - apiGroups: [platform.example.org]
                resources: [webservices]
                verbs: [get, list, watch]
              - apiGroups: [gateway.networking.k8s.io]
                resources: [httproutes]
                verbs: [get, list, watch]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: backstage-kubernetes-read
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: backstage-kubernetes-read
            subjects:
              - kind: ServiceAccount
                name: backstage
                namespace: backstage
          # Secrets from AWS Secrets Manager, through External Secrets. The
          # placeholders are escaped twice: this chart renders them once, and
          # the Backstage chart passes extraDeploy through tpl again.
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: backstage-github-app
            spec:
              refreshInterval: 1h
              secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
              dataFrom:
                - extract: { key: idp/backstage/github-app }
              target:
                name: backstage-github-app
                template:
                  engineVersion: v2
                  data:
                    GITHUB_APP_ID: '{{`{{ "{{ .appId }}" }}`}}'
                    AUTH_GITHUB_CLIENT_ID: '{{`{{ "{{ .clientId }}" }}`}}'
                    AUTH_GITHUB_CLIENT_SECRET: '{{`{{ "{{ .clientSecret }}" }}`}}'
                    GITHUB_APP_PRIVATE_KEY: '{{`{{ "{{ .privateKey }}" }}`}}'
                    GITHUB_APP_WEBHOOK_SECRET: '{{`{{ "{{ .webhookSecret }}" }}`}}'
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: backstage-database
            spec:
              refreshInterval: 1h
              secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
              dataFrom:
                - extract: { key: idp/backstage/database }
              target:
                name: backstage-database
                template:
                  engineVersion: v2
                  data:
                    POSTGRES_HOST: '{{`{{ "{{ .host }}" }}`}}'
                    POSTGRES_PORT: '{{`{{ "{{ .port }}" }}`}}'
                    POSTGRES_USER: '{{`{{ "{{ .user }}" }}`}}'
                    POSTGRES_PASSWORD: '{{`{{ "{{ .password }}" }}`}}'
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
{{- end }}
