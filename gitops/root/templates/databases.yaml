# Databases for WebServices: the CloudNativePG operator for in-cluster
# databases, and the shared Postgres server for managed ones.
{{- $sync := dict "automated" (dict "prune" true "selfHeal" true) "syncOptions" (list "CreateNamespace=true" "ServerSideApply=true" "SkipDryRunOnMissingResource=true") "retry" (dict "limit" 20 "backoff" (dict "duration" "15s" "factor" 2 "maxDuration" "2m")) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: managed-postgres
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    # EKS uses the shared RDS instance; local clusters use a CloudNativePG stand-in.
    path: platform/managed-postgres/{{ if .Values.aws.enabled }}aws{{ else }}local{{ end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
{{- if .Values.aws.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/storage
  destination:
    server: https://kubernetes.default.svc
    # The StorageClass isn't namespaced; this only satisfies the project's destinations.
    namespace: crossplane-system
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
{{- end }}
