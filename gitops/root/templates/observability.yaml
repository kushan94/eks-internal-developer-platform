# Metrics and logs for the platform and every service: metrics-server for
# kubectl top and Backstage, Prometheus to collect metrics, Loki and Alloy to
# collect logs, Grafana to show both, and Alertmanager to send alerts to chat on EKS.
{{- $sync := dict "automated" (dict "prune" true "selfHeal" true) "syncOptions" (list "CreateNamespace=true" "ServerSideApply=true" "SkipDryRunOnMissingResource=true") "retry" (dict "limit" 20 "backoff" (dict "duration" "15s" "factor" 2 "maxDuration" "2m")) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    {{- if not .Values.aws.enabled }}
    helm:
      valuesObject:
        # kind's kubelets use self-signed certificates.
        args: [--kubelet-insecure-tls]
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # The chart's CRDs are large and some fields are defaulted by the API server.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.14.1
    helm:
      valuesObject:
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
            # Routing comes from AlertmanagerConfig resources labelled for it
            # in this namespace (platform/observability/aws on EKS), and
            # applies to alerts from every namespace, not just this one.
            alertmanagerConfigSelector:
              matchLabels:
                platform.example.org/alerting: "true"
            alertmanagerConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            alertmanagerConfigMatcherStrategy:
              type: None
        defaultRules:
          rules:
            # EKS hides the control plane, and kube-proxy serves metrics only
            # on localhost, so these would always report themselves as down.
            etcd: false
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            # Sessions are short and the cluster is rebuilt each time.
            retention: 2d
            resources:
              requests: {cpu: 200m, memory: 512Mi}
              limits: {memory: 1536Mi}
            # Scrape monitors from every namespace, not just this chart's.
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        kube-state-metrics:
          # Lets dashboards and alerts find a service's pods by its Backstage ID,
          # and tell its environments apart.
          metricLabelsAllowlist:
            - pods=[backstage.io/kubernetes-id,platform.example.org/environment]
        grafana:
          defaultDashboardsTimezone: utc
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
          {{- if .Values.aws.enabled }}
          # GitHub login. The OAuth app's client ID and secret come from
          # Secrets Manager through External Secrets.
          envFromSecret: grafana-github-oauth
          grafana.ini:
            server:
              root_url: https://grafana.{{ .Values.domain }}
            auth:
              disable_login_form: true
            auth.github:
              enabled: true
              allow_sign_up: true
              # Grafana always reads the user's teams, which needs read:org.
              scopes: read:user,user:email,read:org
              # Only these GitHub users get in, as admins; everyone else is refused.
              role_attribute_path: "contains([{{ range $i, $u := .Values.grafanaAdmins }}{{ if $i }}, {{ end }}'{{ $u }}'{{ end }}], login) && 'Admin' || ''"
              role_attribute_strict: true
          {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
# Loki stores logs as a single process: in S3 on EKS, so they outlive the
# nightly destroy, and on local disk on kind. Logs are kept for 7 days.
{{- $logStore := ternary "s3" "filesystem" .Values.aws.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2026-11-01"
                store: tsdb
                object_store: {{ $logStore }}
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          storage:
            type: {{ $logStore }}
            {{- if .Values.aws.enabled }}
            # Created by the bootstrap stack. Loki reaches it through Pod Identity.
            bucketNames:
              chunks: idp-logs-{{ .Values.awsAccountId }}
              ruler: idp-logs-{{ .Values.awsAccountId }}
            s3:
              region: {{ .Values.region }}
            {{- end }}
          limits_config:
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: {{ $logStore }}
        serviceAccount:
          name: loki
        singleBinary:
          replicas: 1
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          persistence:
            size: 5Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        # The chart's defaults for a scaled-out Loki, which this doesn't need:
        # the caches alone reserve 9 GiB.
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
# Alloy runs on every node and ships container logs to Loki. Its pipeline
# is in platform/observability/logs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.15.0
      helm:
        valuesObject:
          alloy:
            configMap:
              create: false
              name: alloy-config
              key: config.alloy
            mounts:
              varlog: true
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 512Mi}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: platform/observability/logs
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboards
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerts
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/observability/alerts
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
{{- if .Values.aws.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Grafana's public route and GitHub login, and where alerts are sent.
  name: observability-aws
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/observability/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
{{- end }}
