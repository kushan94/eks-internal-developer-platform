# Platform components: Crossplane, its providers and the WebService API.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform components, managed by the platform team
  sourceRepos:
    - {{ .Values.repoURL }}
    - https://charts.crossplane.io/stable
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://backstage.github.io/charts
  destinations:
    {{- range list "crossplane-system" "aws-load-balancer-controller" "external-dns" "gateway-system" "backstage" }}
    - server: https://kubernetes.default.svc
      namespace: {{ . }}
    {{- end }}
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
# Team workloads. Teams can only create WebServices, only in their own
# namespaces, and only from repos under githubOwner.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
spec:
  description: Team services, deployed through the WebService API
  sourceRepos:
    - {{ .Values.repoURL }}
    - https://github.com/{{ .Values.githubOwner }}/*
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
    {{- range list "default" "argocd" "crossplane-system" "external-secrets" "aws-load-balancer-controller" "external-dns" "gateway-system" "backstage" "kube-*" }}
    - server: https://kubernetes.default.svc
      namespace: "!{{ . }}"
    {{- end }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: platform.example.org
      kind: WebService
