{{- if .Values.aws.enabled }}
# cert-manager, the load balancer controller, ExternalDNS and the Gateway: only on EKS.
{{- $sync := dict "automated" (dict "prune" true "selfHeal" true) "syncOptions" (list "CreateNamespace=true" "ServerSideApply=true" "SkipDryRunOnMissingResource=true") "retry" (dict "limit" 20 "backoff" (dict "duration" "15s" "factor" 2 "maxDuration" "2m")) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.6.2
    helm:
      valuesObject:
        clusterName: {{ .Values.clusterName }}
        region: {{ .Values.region }}
        # The VPC is recreated every session, so find it by its Name tag.
        vpcTags:
          Name: {{ .Values.clusterName }}
        # The chart renders a new certificate on every Argo CD render, so the webhook's
        # CA and its Secret drift apart. cert-manager issues one and keeps the
        # webhook's caBundle in step with it.
        enableCertManager: true
        serviceAccount:
          name: aws-load-balancer-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-load-balancer-controller
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.23.0
    helm:
      valuesObject:
        provider:
          name: aws
        sources: [gateway-httproute]
        domainFilters: [{{ .Values.domain }}]
        policy: sync
        registry: txt
        txtOwnerId: {{ .Values.clusterName }}
        env:
          - name: AWS_REGION
            value: {{ .Values.region }}
        serviceAccount:
          name: external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
{{- end }}
