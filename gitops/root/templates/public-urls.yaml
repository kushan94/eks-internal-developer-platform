{{- if .Values.aws.enabled }}
{{- $sync := dict "automated" (dict "prune" true "selfHeal" true) "syncOptions" (list "CreateNamespace=true" "ServerSideApply=true" "SkipDryRunOnMissingResource=true") "retry" (dict "limit" 20 "backoff" (dict "duration" "15s" "factor" 2 "maxDuration" "2m")) }}
# Gateway API CRDs, at the version the AWS Load Balancer Controller is built for.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.0
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.6.2
    helm:
      valuesObject:
        clusterName: {{ .Values.clusterName }}
        region: {{ .Values.region }}
        # The VPC is recreated every session, so find it by its Name tag.
        vpcTags:
          Name: {{ .Values.clusterName }}
        serviceAccount:
          name: aws-load-balancer-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-load-balancer-controller
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.23.0
    helm:
      valuesObject:
        provider:
          name: aws
        sources: [gateway-httproute]
        domainFilters: [{{ .Values.domain }}]
        policy: sync
        registry: txt
        txtOwnerId: {{ .Values.clusterName }}
        env:
          - name: AWS_REGION
            value: {{ .Values.region }}
        serviceAccount:
          name: external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
{{- end }}
