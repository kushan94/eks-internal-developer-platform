# Gateway API CRDs, on every cluster. WebServices with public: true create an
# HTTPRoute, which needs these types even where nothing serves the route, such as kind.
{{- $sync := dict "automated" (dict "prune" true "selfHeal" true) "syncOptions" (list "CreateNamespace=true" "ServerSideApply=true") "retry" (dict "limit" 20 "backoff" (dict "duration" "15s" "factor" 2 "maxDuration" "2m")) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.0
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    {{- toYaml $sync | nindent 4 }}
