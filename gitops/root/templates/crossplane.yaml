apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: {{ .Values.crossplaneChartVersion }}
    {{- if .Values.highAvailability }}
    helm:
      valuesObject:
        # A standby that takes over through leader election.
        replicas: 2
        rbacManager:
          replicas: 2
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
