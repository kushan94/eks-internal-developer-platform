# A stand-in for Argo CD, so the dashboard has applications to show on a kind
# cluster without Argo CD. The CRD accepts any fields, including status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: applications.argoproj.io}
spec:
  group: argoproj.io
  scope: Namespaced
  names: {kind: Application, plural: applications, singular: application}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Namespace
metadata: {name: argocd}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: shop, namespace: argocd}
spec: {destination: {namespace: shop-prod}}
status: {sync: {status: Synced, revision: 4f9c1d2e8a7b}, health: {status: Healthy}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: loki, namespace: argocd}
spec: {destination: {namespace: monitoring}}
status:
  sync: {status: OutOfSync, revision: 4f9c1d2e8a7b}
  health: {status: Progressing}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: opencost, namespace: argocd}
spec: {destination: {namespace: monitoring}}
status:
  sync: {status: Synced, revision: 4f9c1d2e8a7b}
  health: {status: Degraded, message: "Deployment opencost has 0 available replicas"}
