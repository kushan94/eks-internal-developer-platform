# Answers the dashboard's chart queries with made-up waves, so the charts can be
# looked at on a kind cluster without running Prometheus.
apiVersion: v1
kind: Namespace
metadata: {name: monitoring}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fake-prometheus, namespace: monitoring}
data:
  server.py: |
    import json, math, urllib.parse
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            u = urllib.parse.urlparse(self.path); q = urllib.parse.parse_qs(u.query)
            start, end, step = int(q["start"][0]), int(q["end"][0]), int(q["step"][0])
            query = q["query"][0]
            vals = []
            for i, t in enumerate(range(start, end + 1, step)):
                if "node_cpu" in query: v = 38 + 14 * math.sin(i / 7) + 4 * math.sin(i / 2)
                elif "MemAvailable" in query: v = 56 + 6 * math.sin(i / 19) + i * 0.05
                elif "restarts" in query: v = max(0, round(3 * math.sin(i / 5)) + (4 if i > 40 else 0))
                else: v = 5 if i > 45 else 0
                vals.append([t, str(round(v, 2))])
            body = json.dumps({"status": "success", "data": {"resultType": "matrix", "result": [{"metric": {}, "values": vals}]}}).encode()
            self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
        def log_message(self, *a): pass
    HTTPServer(("", 9090), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fake-prometheus, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: fake-prometheus}}
  template:
    metadata: {labels: {app: fake-prometheus}}
    spec:
      containers:
        - name: app
          image: python:3.13-alpine
          command: [python, /app/server.py]
          volumeMounts: [{name: code, mountPath: /app}]
          resources: {requests: {cpu: 20m, memory: 32Mi}}
      volumes: [{name: code, configMap: {name: fake-prometheus}}]
---
apiVersion: v1
kind: Service
metadata: {name: fake-prometheus, namespace: monitoring}
spec:
  selector: {app: fake-prometheus}
  ports: [{port: 9090}]
