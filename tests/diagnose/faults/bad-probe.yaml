# expect: :9999
# answer: 9999
# runbook: health-checks
apiVersion: v1
kind: Namespace
metadata: {name: fault-bad-probe}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: fault-bad-probe}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: web}}
    spec:
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 9999}
            periodSeconds: 5
