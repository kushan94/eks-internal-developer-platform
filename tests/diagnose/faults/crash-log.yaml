# expect: DATABASE_URL
# answer: DATABASE_URL
# runbook: crash-or-oom
apiVersion: v1
kind: Namespace
metadata: {name: fault-crash-log}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: fault-crash-log}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: web}}
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: [sh, -c, 'echo "FATAL: DATABASE_URL is not set" >&2; exit 1']
