# expect: timed out
# answer: NetworkPolicy|network polic
# runbook: blocked-traffic
# target: client
# A client calls a service whose NetworkPolicy only lets pods labelled
# role=frontend in. The client isn't labelled, so its calls time out. The
# diagnosis target is the client, whose log shows only the timeout.
apiVersion: v1
kind: Namespace
metadata: {name: fault-blocked-traffic}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: fault-blocked-traffic}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: web}}
    spec:
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: fault-blocked-traffic}
spec:
  selector: {app.kubernetes.io/name: web}
  ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web, namespace: fault-blocked-traffic}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: web}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {role: frontend}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: fault-blocked-traffic}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: client}}
  template:
    metadata: {labels: {app.kubernetes.io/name: client}}
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              while true; do
                out=$(wget -q -T 3 -O /dev/null http://web:8080 2>&1) || echo "call to web failed: $out"
                sleep 5
              done
