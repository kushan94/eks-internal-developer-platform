# expect: db-credentials
apiVersion: v1
kind: Namespace
metadata: {name: fault-missing-secret}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: fault-missing-secret}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: web}}
    spec:
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.29-alpine
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db-credentials, key: url}}
