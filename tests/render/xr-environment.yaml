# A service with environments: its kustomization labels the WebService with
# the shared Backstage ID and the environment.
apiVersion: platform.example.org/v1alpha1
kind: WebService
metadata:
  name: visits
  namespace: demo-prod
  labels:
    backstage.io/kubernetes-id: demo-visits
    platform.example.org/environment: prod
spec:
  runtime: kubernetes
  image: ghcr.io/kushan94/idp-visits:abfad8f78730c500a740b68069fd7ae1cd3d083d
  port: 8080
  replicas: 2
  database:
    class: managed
