# Must be refused: autoscaling is Kubernetes-only for now.
apiVersion: platform.example.org/v1alpha1
kind: WebService
metadata:
  name: search
  namespace: team-a
spec:
  runtime: ecs
  image: nginxinc/nginx-unprivileged:1.29-alpine
  port: 8080
  replicas: 2
  autoscaling:
    minReplicas: 2
    maxReplicas: 8
