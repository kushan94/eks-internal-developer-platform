# A service that sets its own CPU and memory.
apiVersion: platform.example.org/v1alpha1
kind: WebService
metadata:
  name: reports
  namespace: team-a
spec:
  runtime: kubernetes
  image: nginxinc/nginx-unprivileged:1.29-alpine
  port: 8080
  replicas: 2
  resources:
    cpu: 250m
    memory: 512Mi
