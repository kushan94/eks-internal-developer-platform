# `kyverno test tests/policies`: prod refuses one replica, or an autoscaling
# minimum of one even with more replicas set; dev doesn't care.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: environments
policies:
  - ../../../platform/policies/environments.yaml
resources:
  - webservices.yaml
variables: ../values.yaml
results:
  - policy: prod-replicas
    resources: [prod-one, prod-autoscaled-one]
    result: fail
  - policy: prod-replicas
    resources: [prod-two, prod-autoscaled-two]
    result: pass
