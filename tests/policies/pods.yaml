  namespace: team-a
spec:
  containers:
    - name: app
      image: 111122223333.dkr.ecr.eu-north-1.amazonaws.com.evil.example/idp-apps/orders:0123456789ab
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
