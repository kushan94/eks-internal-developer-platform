# promtool unit tests for platform/observability/alerts/webservice.yaml.
# make test extracts the rule groups from the PrometheusRule into
# .test/alerts/webservice.yaml first.
rule_files:
  - ../../.test/alerts/webservice.yaml

evaluation_interval: 1m

tests:
  # shop's app pod is not ready, while its database pod is. blog is fine.
  - interval: 1m
    input_series:
      - series: 'kube_pod_labels{namespace="demo", pod="shop-7d9f-abcde", label_backstage_io_kubernetes_id="shop"}'
        values: "1x15"
      - series: 'kube_pod_labels{namespace="demo", pod="shop-db-1", label_backstage_io_kubernetes_id="shop"}'
        values: "1x15"
      - series: 'kube_pod_labels{namespace="demo", pod="blog-5c4b-fghij", label_backstage_io_kubernetes_id="blog"}'
        values: "1x15"
      - series: 'kube_pod_owner{namespace="demo", pod="shop-7d9f-abcde", owner_kind="ReplicaSet", owner_name="shop-7d9f"}'
        values: "1x15"
      - series: 'kube_pod_owner{namespace="demo", pod="shop-db-1", owner_kind="Cluster", owner_name="shop-db"}'
        values: "1x15"
      - series: 'kube_pod_owner{namespace="demo", pod="blog-5c4b-fghij", owner_kind="ReplicaSet", owner_name="blog-5c4b"}'
        values: "1x15"
      - series: 'kube_pod_status_ready{namespace="demo", pod="shop-7d9f-abcde", condition="true"}'
        values: "0x15"
      - series: 'kube_pod_status_ready{namespace="demo", pod="shop-db-1", condition="true"}'
        values: "1x15"
      - series: 'kube_pod_status_ready{namespace="demo", pod="blog-5c4b-fghij", condition="true"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 3m
        alertname: WebServiceDown
        exp_alerts: []
      - eval_time: 6m
        alertname: WebServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: demo
              service: shop
            exp_annotations:
              summary: "shop in demo has no ready pods."
              dashboard: "/d/webservice/webservice?var-service=shop&var-environment=$__all"

  # shop's container restarts every 3 minutes; blog's restarted once.
  - interval: 1m
    input_series:
      - series: 'kube_pod_labels{namespace="demo", pod="shop-7d9f-abcde", label_backstage_io_kubernetes_id="shop"}'
        values: "1x30"
      - series: 'kube_pod_labels{namespace="demo", pod="blog-5c4b-fghij", label_backstage_io_kubernetes_id="blog"}'
        values: "1x30"
      - series: 'kube_pod_container_status_restarts_total{namespace="demo", pod="shop-7d9f-abcde", container="app"}'
        values: "0 0 0 1 1 1 2 2 2 3 3 3 4 4 4 5 5 5 6 6 6 7 7 7 8 8 8 9 9 9 10"
      - series: 'kube_pod_container_status_restarts_total{namespace="demo", pod="blog-5c4b-fghij", container="app"}'
        values: "0 0 0 1x27"
    alert_rule_test:
      - eval_time: 25m
        alertname: WebServiceRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: demo
              service: shop
            exp_annotations:
              summary: "shop in demo restarted 5 times in 15 minutes."
              dashboard: "/d/webservice/webservice?var-service=shop&var-environment=$__all"

  # visits runs in dev and prod; only prod's pod is down, and the alert says which environment.
  - interval: 1m
    input_series:
      - series: 'kube_pod_labels{namespace="demo-prod", pod="visits-6c8d-aaaaa", label_backstage_io_kubernetes_id="demo-visits", label_platform_example_org_environment="prod"}'
        values: "1x15"
      - series: 'kube_pod_labels{namespace="demo-dev", pod="visits-7f9e-bbbbb", label_backstage_io_kubernetes_id="demo-visits", label_platform_example_org_environment="dev"}'
        values: "1x15"
      - series: 'kube_pod_owner{namespace="demo-prod", pod="visits-6c8d-aaaaa", owner_kind="ReplicaSet", owner_name="visits-6c8d"}'
        values: "1x15"
      - series: 'kube_pod_owner{namespace="demo-dev", pod="visits-7f9e-bbbbb", owner_kind="ReplicaSet", owner_name="visits-7f9e"}'
        values: "1x15"
      - series: 'kube_pod_status_ready{namespace="demo-prod", pod="visits-6c8d-aaaaa", condition="true"}'
        values: "0x15"
      - series: 'kube_pod_status_ready{namespace="demo-dev", pod="visits-7f9e-bbbbb", condition="true"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 6m
        alertname: WebServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: demo-prod
              service: demo-visits
              environment: prod
            exp_annotations:
              summary: "demo-visits in demo-prod has no ready pods."
              dashboard: "/d/webservice/webservice?var-service=demo-visits&var-environment=prod"

  # Cost: visits in prod (app + database on n1) and dev (app on n2). A platform
  # pod without a service label isn't counted.
  - interval: 1m
    input_series:
      - series: 'node_cpu_hourly_cost{node="n1", instance="n1", instance_type="m7i-flex.large"}'
        values: "0.04x5"
      - series: 'node_ram_hourly_cost{node="n1", instance="n1", instance_type="m7i-flex.large"}'
        values: "0.005x5"
      - series: 'node_cpu_hourly_cost{node="n2", instance="n2", instance_type="t3.medium"}'
        values: "0.02x5"
      - series: 'node_ram_hourly_cost{node="n2", instance="n2", instance_type="t3.medium"}'
        values: "0.003x5"
      - series: 'container_cpu_allocation{namespace="demo-prod", pod="visits-a", container="app", node="n1", instance="n1"}'
        values: "0.5x5"
      - series: 'container_memory_allocation_bytes{namespace="demo-prod", pod="visits-a", container="app", node="n1", instance="n1"}'
        values: "1073741824x5"
      - series: 'container_cpu_allocation{namespace="demo-prod", pod="visits-db-1", container="postgres", node="n1", instance="n1"}'
        values: "0.1x5"
      - series: 'container_memory_allocation_bytes{namespace="demo-prod", pod="visits-db-1", container="postgres", node="n1", instance="n1"}'
        values: "536870912x5"
      - series: 'container_cpu_allocation{namespace="demo-dev", pod="visits-b", container="app", node="n2", instance="n2"}'
        values: "0.25x5"
      - series: 'container_memory_allocation_bytes{namespace="demo-dev", pod="visits-b", container="app", node="n2", instance="n2"}'
        values: "536870912x5"
      - series: 'container_cpu_allocation{namespace="monitoring", pod="prometheus-0", container="prometheus", node="n1", instance="n1"}'
        values: "1x5"
      - series: 'container_memory_allocation_bytes{namespace="monitoring", pod="prometheus-0", container="prometheus", node="n1", instance="n1"}'
        values: "2147483648x5"
      - series: 'kube_pod_labels{namespace="demo-prod", pod="visits-a", label_backstage_io_kubernetes_id="demo-visits", label_platform_example_org_environment="prod"}'
        values: "1x5"
      - series: 'kube_pod_labels{namespace="demo-prod", pod="visits-db-1", label_backstage_io_kubernetes_id="demo-visits", label_platform_example_org_environment="prod"}'
        values: "1x5"
      - series: 'kube_pod_labels{namespace="demo-dev", pod="visits-b", label_backstage_io_kubernetes_id="demo-visits", label_platform_example_org_environment="dev"}'
        values: "1x5"
      - series: 'kube_pod_labels{namespace="monitoring", pod="prometheus-0"}'
        values: "1x5"
    promql_expr_test:
      # Rounded to a hundredth of a cent, so floating point doesn't fail the test.
      - expr: round(webservice:cost_dollars_per_hour, 0.0001)
        eval_time: 2m
        exp_samples:
          - labels: '{namespace="demo-prod", service="demo-visits", environment="prod"}'
            value: 0.0315
          - labels: '{namespace="demo-dev", service="demo-visits", environment="dev"}'
            value: 0.0065
