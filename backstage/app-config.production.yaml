# Production settings, used in the cluster together with app-config.yaml.
# Values in ${...} come from environment variables, which the Helm release
# fills from Kubernetes secrets created by External Secrets.

app:
  baseUrl: https://backstage.idp.skyforgelab.cloud

backend:
  baseUrl: https://backstage.idp.skyforgelab.cloud
  # An object, not ':7007': the Helm chart sets APP_CONFIG_backend_listen_port,
  # and Backstage can't merge that into a string.
  listen:
    port: 7007
  cors:
    origin: https://backstage.idp.skyforgelab.cloud
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # Amazon RDS requires TLS. The CA bundle is baked into the image.
      ssl:
        ca:
          $file: ./rds-ca-bundle.pem

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # Only GitHub users with a matching User entity in the catalog can sign in.
            - resolver: usernameMatchingUserEntityName

# Backstage reads the catalog and opens pull requests as its own GitHub App,
# not as a person.
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${AUTH_GITHUB_CLIENT_ID}
          clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          webhookSecret: ${GITHUB_APP_WEBHOOK_SECRET}

catalog:
  # Overrides the default list locations from app-config.yaml.
  locations:
    - type: url
      target: https://github.com/kushan94/eks-internal-developer-platform/blob/main/catalog/**/*.yaml
    - type: file
      target: ./templates/webservice/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

# Shows each service's Kubernetes objects on its page. Backstage reads the
# cluster it runs in with its own service account, which has read-only access.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: idp
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFilePath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # No metrics-server yet; avoids a warning on every service page.
          skipMetricsLookup: true
  # The default list includes ConfigMaps, which Backstage's role can't read.
  objectTypes:
    - pods
    - services
    - deployments
    - replicasets
    - horizontalpodautoscalers
    - jobs
    - cronjobs
    - ingresses
    - statefulsets
    - daemonsets
    - limitranges
    - resourcequotas
  customResources:
    - group: platform.example.org
      apiVersion: v1alpha1
      plural: webservices
    - group: gateway.networking.k8s.io
      apiVersion: v1
      plural: httproutes
