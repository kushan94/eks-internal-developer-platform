apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: webservice
  title: Web Service
  description: Opens a pull request that adds a WebService. Argo CD deploys it once the pull request is merged.
  tags:
    - crossplane
    - gitops
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Service details
      # In-cluster databases run next to Kubernetes pods, so ECS services can't use them.
      if:
        properties:
          runtime:
            const: ecs
      then:
        properties:
          database:
            not:
              const: in-cluster
      required:
        - name
        - namespace
        - owner
        - runtime
        - image
      properties:
        name:
          title: Name
          type: string
          description: Lowercase letters, numbers and hyphens.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        namespace:
          title: Namespace
          type: string
          description: Your team's namespace. It is created if it does not exist. System namespaces are not allowed.
          pattern: '^(?!kube-|default$|argocd$|crossplane-system$)[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
        owner:
          title: Owner
          type: string
          description: The team that owns the service.
          default: group:default/platform-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        runtime:
          title: Runtime
          type: string
          description: Where the service runs. Both runtimes take the same settings.
          default: kubernetes
          oneOf:
            - const: kubernetes
              title: Kubernetes (EKS)
            - const: ecs
              title: ECS Fargate
        image:
          title: Container image
          type: string
          description: >-
            With a version tag, from ghcr.io/kushan94, ghcr.io/stefanprodan or
            docker.io/nginxinc. For example, nginxinc/nginx-unprivileged:1.29-alpine
          pattern: '^\S+$'
        port:
          title: Container port
          type: integer
          default: 8080
          minimum: 1
          maximum: 65535
        replicas:
          title: Replicas
          type: integer
          default: 2
          minimum: 1
          maximum: 10
        environments:
          title: Run in dev, staging and prod
          type: boolean
          default: true
          description: >-
            Separate dev, staging and prod namespaces, each with its own database.
            You deploy to dev first and promote the same image onward with the
            Promote workflow. Prod runs at least 2 replicas.
        public:
          title: Public URL
          type: boolean
          default: false
          description: Serve the service at https://<name>-<namespace>.idp.skyforgelab.cloud. Kubernetes runtime only, for now.
        database:
          title: Database
          type: string
          description: >-
            A PostgreSQL database. Your container gets PGHOST, PGPORT, PGDATABASE,
            PGUSER, PGPASSWORD and PGSSLMODE (and DATABASE_URL on Kubernetes).
          default: none
          oneOf:
            - const: none
              title: None
            - const: managed
              title: Managed (shared RDS, works with both runtimes)
            - const: in-cluster
              title: In-cluster (CloudNativePG, Kubernetes runtime only)

  steps:
    - id: render
      name: Render the catalog entry
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          runtime: ${{ parameters.runtime }}
          owner: ${{ parameters.owner }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          public: ${{ parameters.public }}
          database: ${{ parameters.database }}
          environments: ${{ parameters.environments }}

    - id: render-workload
      name: Render the service
      if: ${{ not parameters.environments }}
      action: fetch:template
      input:
        url: ./skeleton-single
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          runtime: ${{ parameters.runtime }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          public: ${{ parameters.public }}
          database: ${{ parameters.database }}

    - id: render-environments
      name: Render dev, staging and prod
      if: ${{ parameters.environments }}
      action: fetch:template
      input:
        url: ./skeleton-envs
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          runtime: ${{ parameters.runtime }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          public: ${{ parameters.public }}
          database: ${{ parameters.database }}

    - id: pull-request
      name: Open pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=kushan94&repo=eks-internal-developer-platform
        branchName: webservice-${{ parameters.namespace }}-${{ parameters.name }}
        title: Add WebService ${{ parameters.namespace }}/${{ parameters.name }}
        description: |
          Adds the `${{ parameters.name }}` WebService, running on `${{ parameters.runtime }}`, with database: `${{ parameters.database }}`.
          {%- if parameters.environments %} It runs in dev, staging and prod, in the `${{ parameters.namespace }}-dev`, `-staging` and `-prod` namespaces. New images go to dev; the Promote workflow moves them on.{%- else %} It runs in the `${{ parameters.namespace }}` namespace.{%- endif %}

          Created from the Backstage Web Service template. Argo CD deploys it after this pull request is merged.

  output:
    links:
      - title: Pull request
        url: ${{ steps['pull-request'].output.remoteUrl }}
