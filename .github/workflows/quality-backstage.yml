name: Quality (Backstage)

# Checks the Backstage app: types, lint, formatting and tests. Called by CI on
# every pull request and by the image workflow before it builds.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backstage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backstage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from packageManager in package.json.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backstage/yarn.lock
      - name: Install exactly what yarn.lock says
        run: yarn install --immutable
      - name: Types
        run: yarn tsc
      - name: Lint
        run: yarn lint:all
      - name: Formatting
        run: yarn prettier:check
      - name: Tests
        run: yarn test:all
        env:
          CI: "true"
