name: Infrastructure

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [plan, apply, destroy]
        default: plan
      enable_eks:
        description: Include the EKS cluster (about $0.36 an hour with everything else)
        type: boolean
        default: false
  schedule:
    # Destroy everything every night at 22:00 UTC, so a forgotten session can't use up the credits.
    - cron: "0 22 * * *"

permissions:
  contents: read

# Only one run touches the Terraform state at a time.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_VERSION: 1.17.1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive ..
      - run: terraform init -backend=false
      - run: terraform validate

  # Logs of a public repo are public, so plans print only resource addresses
  # and actions, never attribute values. The account ID and allowed IP are masked.
  plan:
    needs: validate
    # Pull requests from forks get no secrets, so they stop at validate.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply'))
    runs-on: ubuntu-latest
    environment: aws-plan
    env:
      TF_VAR_region: eu-north-1
      TF_VAR_allowed_cidrs: '["${{ secrets.ALLOWED_CIDR }}"]'
      TF_VAR_cluster_admin_arns: ${{ secrets.CLUSTER_ADMIN_ARNS }}
      TF_VAR_enable_eks: ${{ inputs.enable_eks || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: true
      - name: Check secrets
        env:
          CLUSTER_ADMIN_ARNS: ${{ secrets.CLUSTER_ADMIN_ARNS }}
          ALLOWED_CIDR: ${{ secrets.ALLOWED_CIDR }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          missing=""
          for name in CLUSTER_ADMIN_ARNS ALLOWED_CIDR TF_STATE_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the ${{ github.job == 'plan' && 'aws-plan' || 'aws-apply or aws-destroy' }} environment:$missing. Run 'make github-setup' after 'aws login'."
            exit 1
          fi
      - run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" > /dev/null
      - name: Plan
        run: |
          if ! terraform plan -no-color -out=tfplan > plan.log 2>&1; then
            grep -A8 -E '^Error' plan.log || tail -n 30 plan.log
            exit 1
          fi
          grep -E '^(Plan:|No changes)' plan.log
      - name: Summarize
        run: |
          {
            echo "### Terraform plan (enable_eks=${TF_VAR_enable_eks})"
            echo '```'
            terraform show -json tfplan | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join("/"))  \(.address)"'
            grep -E '^(Plan:|No changes)' plan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    # Requires approval in GitHub, after the plan job's summary shows what will change.
    environment: aws-apply
    env:
      TF_VAR_region: eu-north-1
      TF_VAR_allowed_cidrs: '["${{ secrets.ALLOWED_CIDR }}"]'
      TF_VAR_cluster_admin_arns: ${{ secrets.CLUSTER_ADMIN_ARNS }}
      TF_VAR_enable_eks: ${{ inputs.enable_eks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: true
      - name: Check secrets
        env:
          CLUSTER_ADMIN_ARNS: ${{ secrets.CLUSTER_ADMIN_ARNS }}
          ALLOWED_CIDR: ${{ secrets.ALLOWED_CIDR }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          missing=""
          for name in CLUSTER_ADMIN_ARNS ALLOWED_CIDR TF_STATE_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the ${{ github.job == 'plan' && 'aws-plan' || 'aws-apply or aws-destroy' }} environment:$missing. Run 'make github-setup' after 'aws login'."
            exit 1
          fi
      - run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" > /dev/null
      - name: Apply
        run: |
          if ! terraform apply -auto-approve -no-color > apply.log 2>&1; then
            grep -A8 -E '^Error' apply.log || tail -n 30 apply.log
            exit 1
          fi
          grep -E '^Apply complete' apply.log
          echo "Applied with enable_eks=${TF_VAR_enable_eks}. $(grep -E '^Apply complete' apply.log)" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'destroy')
    runs-on: ubuntu-latest
    # The nightly run uses an environment without approval, limited to main.
    environment: ${{ github.event_name == 'schedule' && 'aws-destroy' || 'aws-apply' }}
    env:
      TF_VAR_region: eu-north-1
      TF_VAR_allowed_cidrs: '["${{ secrets.ALLOWED_CIDR }}"]'
      TF_VAR_cluster_admin_arns: ${{ secrets.CLUSTER_ADMIN_ARNS }}
      # Destroy everything in the state, whichever parts exist.
      TF_VAR_enable_eks: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: true
      - name: Check secrets
        env:
          CLUSTER_ADMIN_ARNS: ${{ secrets.CLUSTER_ADMIN_ARNS }}
          ALLOWED_CIDR: ${{ secrets.ALLOWED_CIDR }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          missing=""
          for name in CLUSTER_ADMIN_ARNS ALLOWED_CIDR TF_STATE_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the ${{ github.job == 'plan' && 'aws-plan' || 'aws-apply or aws-destroy' }} environment:$missing. Run 'make github-setup' after 'aws login'."
            exit 1
          fi
      - run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" > /dev/null
      # The AWS Load Balancer Controller creates ALBs, target groups and security
      # groups outside Terraform. Left behind, they block deleting the VPC.
      - name: Delete load balancers created from Kubernetes
        working-directory: .
        run: scripts/delete-k8s-load-balancers.sh idp
      # Records ExternalDNS created would otherwise point at the deleted load balancer.
      - name: Delete DNS records created from Kubernetes
        working-directory: .
        run: scripts/delete-external-dns-records.sh idp.skyforgelab.cloud idp
      # Database passwords Crossplane copied to Secrets Manager for ECS services.
      - name: Delete secrets created from Kubernetes
        working-directory: .
        run: scripts/delete-workload-secrets.sh idp
      - name: Destroy
        run: |
          if [ -z "$(terraform state list)" ]; then
            echo "Nothing to destroy." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! terraform destroy -auto-approve -no-color > destroy.log 2>&1; then
            grep -A8 -E '^Error' destroy.log || tail -n 30 destroy.log
            exit 1
          fi
          grep -E '^Destroy complete' destroy.log | tee -a "$GITHUB_STEP_SUMMARY"
