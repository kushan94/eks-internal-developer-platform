name: Quality (image)

# Lints a Dockerfile, builds the image without pushing it, and scans it for
# vulnerabilities that have a fix. Called by CI on every pull request and by the
# image workflows before they push, so a vulnerable image never reaches the
# registry or the cluster.

on:
  workflow_call:
    inputs:
      context:
        description: Build context, e.g. apps/visits
        type: string
        required: true
      file:
        description: Dockerfile path
        type: string
        required: true
      library-blocking:
        description: Whether a fixable finding in a language dependency (npm, Go module) fails the scan. False only reports it.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.file }}
          # Style notes don't fail the build. DL3008 (pin apt packages) is ignored
          # because Debian removes old versions, so a pin breaks the next build.
          failure-threshold: warning
          ignore: DL3008
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One architecture is enough to scan, and it loads into the local Docker.
      - name: Build, without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan:local
          cache-from: type=gha
      # Only findings that have a fixed version, so the build can't be blocked
      # by something nobody can fix yet. Operating system packages always fail.
      - name: Scan the operating system packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:local
          pkg-types: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the language dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:local
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ inputs.library-blocking && '1' || '0' }}
