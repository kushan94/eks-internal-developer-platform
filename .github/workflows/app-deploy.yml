name: App deploy

# For application repos under this GitHub account. An app repo calls this from
# its own workflow on pushes to main:
#
#   jobs:
#     deploy:
#       permissions: { contents: write, id-token: write }
#       uses: kushan94/eks-internal-developer-platform/.github/workflows/app-deploy.yml@main
#
# It lints and scans the image, pushes it to the platform's ECR registry as
# idp-apps/<repo>:<commit>, signs it, and records the tag in the app repo's
# deploy folder, which Argo CD watches (see apps/README.md). The deploy file
# names the image as idp-apps/<repo>:<commit>, without the registry address,
# because that holds the AWS account ID. The WebService composition adds it.
#
# The calling repo needs an aws-build environment, limited to main, holding that
# repo's push-only key: scripts/app-repo-setup.sh in this repo creates it.
#
# The signature carries this workflow's identity, not the app repo's. That is
# what the cluster's signed-images policy checks, so an image only gets in by
# passing the scan here.

on:
  workflow_call:
    inputs:
      context:
        description: Build context in the app repo
        type: string
        default: .
      file:
        description: Dockerfile path in the app repo
        type: string
        default: Dockerfile
      deploy-file:
        description: The WebService file that holds the image, in the app repo
        type: string
        default: deploy/web.yaml
      library-blocking:
        description: Whether a fixable finding in a language dependency fails the scan
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Called by its full name, because a ./ path would look in the app repo.
  scan:
    uses: kushan94/eks-internal-developer-platform/.github/workflows/quality-image.yml@main
    with:
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      library-blocking: ${{ inputs.library-blocking }}
  build:
    needs: [scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # The caller's environment, which holds only this repo's push-only ECR key
    # and which only its default branch can use.
    environment: aws-build
    env:
      AWS_REGION: eu-north-1
    steps:
      # The signature doesn't record which branch called this workflow, so a
      # branch could otherwise get an image the cluster trusts.
      - name: Only deploy from the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ "$REF" = "refs/heads/${DEFAULT_BRANCH}" ] || { echo "::error::deploys only run on ${DEFAULT_BRANCH}, not ${REF}"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # The repository is idp-apps/ plus the repo's name, which Terraform
      # created for this repo (infra/bootstrap/apps.tf).
      - name: Name the image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          ref="idp-apps/${REPOSITORY#*/}"
          echo "ref=${ref,,}" >> "$GITHUB_OUTPUT"
          echo "name=${REGISTRY}/${ref,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signs the digest, which covers both architectures, not the tag.
      - name: Sign
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Deploy the new image through Git
        env:
          # The short name: the registry address stays out of the repo.
          IMAGE: ${{ steps.image.outputs.ref }}
          DEPLOY_FILE: ${{ inputs.deploy-file }}
        run: |
          # The file holds exactly one image, so a mistyped path or a second
          # container fails here instead of deploying nothing.
          [ "$(grep -c '^  image: ' "$DEPLOY_FILE")" = 1 ] || { echo "::error::$DEPLOY_FILE must have exactly one '  image:' line"; exit 1; }
          sed -i -E "s|^  image: .*|  image: ${IMAGE}:${GITHUB_SHA}|" "$DEPLOY_FILE"
          git diff --quiet && { echo "Tag unchanged."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7}"
          # Another push to main may have landed in the meantime.
          for attempt in 1 2 3 4 5; do
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
            git pull --rebase
          done
          echo "Deployed ${IMAGE}:${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
