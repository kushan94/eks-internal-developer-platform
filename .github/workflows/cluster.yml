name: Cluster

# Installs what Argo CD can't install itself, then lets Argo CD take over.
# Runs on the self-hosted runner inside the VPC, which reaches the private EKS
# endpoint and uses its instance role, so no AWS keys are involved.

on:
  workflow_run:
    workflows: [Infrastructure]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-setup
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  CLUSTER_NAME: idp
  KUBE_CONTEXT: idp-eks

jobs:
  # The infrastructure workflow also runs plans and destroys, so only continue
  # when a cluster actually exists. A self-hosted job with no runner would
  # otherwise wait in the queue for a day.
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: aws-plan
    outputs:
      cluster: ${{ steps.cluster.outputs.exists }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: true
      - id: cluster
        run: |
          status=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.status --output text 2>/dev/null || echo NONE)
          echo "Cluster status: $status"
          echo "exists=$([ "$status" = ACTIVE ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  setup:
    needs: check
    if: needs.check.outputs.cluster == 'true'
    runs-on: [self-hosted, idp-vpc]
    timeout-minutes: 40
    steps:
      - name: Mask the account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Connect to the cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME" --alias "$KUBE_CONTEXT"
      - name: Read Terraform outputs
        run: make tf-init TF_STATE_BUCKET="idp-tfstate-$(aws sts get-caller-identity --query Account --output text)" > /dev/null
      - name: Install Argo CD and External Secrets
        run: make platform-bootstrap
      - name: Hand over to Argo CD
        run: make gitops REPO_URL="https://github.com/${{ github.repository }}.git" AWS_ENABLED=true
      - name: Apply the aws-platform settings
        run: make aws-environment
      - name: Wait for Argo CD
        run: make wait-apps
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Argo CD applications"
            echo '```'
            kubectl --context "$KUBE_CONTEXT" -n argocd get applications 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
