# One shared, internet-facing ALB for every public WebService. The AWS Load
# Balancer Controller creates it from this Gateway and finds the wildcard
# certificate in ACM by the HTTPS listener's hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
# Route to pod IPs directly, so Services can stay ClusterIP.
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: gateway-defaults
  namespace: gateway-system
spec:
  defaultConfiguration:
    targetType: ip
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: public
  namespace: gateway-system
spec:
  scheme: internet-facing
  defaultTargetGroupConfiguration:
    name: gateway-defaults
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: gateway-system
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: public
  listeners:
    # Only the redirect below attaches here.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.idp.skyforgelab.cloud"
      allowedRoutes:
        namespaces:
          from: Same
    # WebService routes from any namespace. Crossplane creates them; teams
    # can't, because the workloads project only allows WebServices.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.idp.skyforgelab.cloud"
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: gateway-system
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
