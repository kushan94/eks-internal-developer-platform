apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webservices.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: WebService
    plural: webservices
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Runtime
          type: string
          jsonPath: .spec.runtime
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Database
          type: string
          jsonPath: .spec.database.class
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                runtime:
                  type: string
                  enum: [kubernetes, ecs]
                  default: kubernetes
                  description: Where the service runs, on Kubernetes or on ECS Fargate.
                image:
                  type: string
                  description: Container image to run.
                port:
                  type: integer
                  default: 8080
                  description: Port the container listens on.
                replicas:
                  type: integer
                  minimum: 1
                  default: 2
                public:
                  type: boolean
                  default: false
                  description: Give the service a public HTTPS URL. Kubernetes runtime only, for now.
                database:
                  type: object
                  description: >-
                    A PostgreSQL database for the service. The container gets
                    PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD and PGSSLMODE,
                    and on Kubernetes also DATABASE_URL.
                  required: [class]
                  properties:
                    class:
                      type: string
                      enum: [managed, in-cluster]
                      description: >-
                        managed: a database and login on the platform's shared
                        Postgres server (RDS on AWS). in-cluster: a CloudNativePG
                        Postgres cluster next to the service, Kubernetes runtime only.
            status:
              type: object
              properties:
                url:
                  type: string
                  description: Public URL, when spec.public is true.
                database:
                  type: object
                  properties:
                    host:
                      type: string
                    name:
                      type: string
                    secretName:
                      type: string
                      description: Kubernetes Secret that holds the database login.
