apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webservices.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: WebService
    plural: webservices
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                runtime:
                  type: string
                  enum: [kubernetes, ecs]
                  default: kubernetes
                  description: Where the service runs, on Kubernetes or on ECS Fargate.
                image:
                  type: string
                  description: Container image to run.
                port:
                  type: integer
                  default: 8080
                  description: Port the container listens on.
                replicas:
                  type: integer
                  minimum: 1
                  default: 2
