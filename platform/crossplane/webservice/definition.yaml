apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webservices.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: WebService
    plural: webservices
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Runtime
          type: string
          jsonPath: .spec.runtime
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Database
          type: string
          jsonPath: .spec.database.class
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                runtime:
                  type: string
                  enum: [kubernetes, ecs]
                  default: kubernetes
                  description: Where the service runs, on Kubernetes or on ECS Fargate.
                image:
                  type: string
                  description: Container image to run.
                port:
                  type: integer
                  default: 8080
                  description: Port the container listens on.
                replicas:
                  type: integer
                  minimum: 1
                  default: 2
                  description: Number of copies to run. Ignored when autoscaling is set.
                allowFrom:
                  type: array
                  maxItems: 20
                  description: >-
                    Other teams' services that may call this one, on its port. By
                    default only its own namespace can. With environments, callers
                    must be in the same environment. Kubernetes runtime only.
                  items:
                    type: object
                    required: [team]
                    properties:
                      team:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        description: The calling team, as named in workloads/<team>.
                      service:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        description: One of the team's services. Leave out to allow all of them.
                allowTo:
                  type: array
                  maxItems: 20
                  description: >-
                    Other teams' services this one calls, on any port. They must also
                    list it in their allowFrom. By default a service can only reach DNS,
                    its own namespace and its database. With environments, only the
                    same environment. Kubernetes runtime only.
                  items:
                    type: object
                    required: [team]
                    properties:
                      team:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      service:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        description: One of the team's services. Leave out to allow all of them.
                allowInternet:
                  type: boolean
                  default: false
                  description: >-
                    Let the service connect to the public internet, such as external
                    APIs. Private address ranges stay blocked. Kubernetes runtime only.
                autoscaling:
                  type: object
                  description: >-
                    Scale between minReplicas and maxReplicas on CPU use, instead of
                    running a fixed number of replicas. Kubernetes runtime only.
                  required: [minReplicas, maxReplicas]
                  x-kubernetes-validations:
                    - rule: self.maxReplicas >= self.minReplicas
                      message: maxReplicas must be at least minReplicas
                  properties:
                    minReplicas:
                      type: integer
                      minimum: 1
                    maxReplicas:
                      type: integer
                      minimum: 1
                      maximum: 50
                    targetCPUUtilization:
                      type: integer
                      minimum: 10
                      maximum: 100
                      default: 70
                      description: Average CPU use, as a percentage of each pod's CPU request, to aim for.
                public:
                  type: boolean
                  default: false
                  description: Give the service a public HTTPS URL. Kubernetes runtime only, for now.
                runAsUser:
                  type: integer
                  minimum: 1
                  description: >-
                    Numeric user ID to run the container as. Only needed when the
                    image names its user, such as USER app, instead of numbering it,
                    because Kubernetes can then not check that it isn't root.
                resources:
                  type: object
                  description: >-
                    CPU and memory for each copy of the service. Leave it out for the
                    platform's defaults: 50m of CPU and 64Mi of memory requested, and a
                    256Mi memory limit. There is no CPU limit, so a busy service can use
                    spare CPU. Kubernetes runtime only.
                  properties:
                    cpu:
                      x-kubernetes-int-or-string: true
                      maxLength: 12
                      anyOf:
                        - type: integer
                        - type: string
                      description: >-
                        CPU to request, between 10m and 2 cores, such as 250m or 1. Write
                        a fraction of a core in millicores (500m, not 0.5). The scheduler
                        reserves it, and autoscaling measures use against it.
                      x-kubernetes-validations:
                        - rule: "isQuantity(string(self)) && quantity(string(self)).compareTo(quantity('10m')) >= 0 && quantity(string(self)).compareTo(quantity('2')) <= 0"
                          message: cpu must be from 10m to 2 cores, such as 250m or 1. Write a fraction in millicores (500m, not 0.5)
                    memory:
                      x-kubernetes-int-or-string: true
                      maxLength: 12
                      anyOf:
                        - type: integer
                        - type: string
                      description: >-
                        Memory limit, between 32Mi and 4Gi, such as 512Mi. The same
                        amount is requested, so the node reserves what the service may
                        use. A container that goes over it is killed.
                      x-kubernetes-validations:
                        - rule: "isQuantity(string(self)) && quantity(string(self)).compareTo(quantity('32Mi')) >= 0 && quantity(string(self)).compareTo(quantity('4Gi')) <= 0"
                          message: memory must be from 32Mi to 4Gi, such as 512Mi
                healthCheck:
                  type: object
                  description: >-
                    How Kubernetes tells that the service is ready for traffic and still
                    alive. Without it, a service is ready once its port accepts
                    connections. With it, the path is called over HTTP: a 2xx or 3xx
                    answer means ready, a container that stops answering is restarted,
                    and a slow start gets up to a minute before that can happen.
                    Kubernetes runtime only.
                  required: [path]
                  properties:
                    path:
                      type: string
                      maxLength: 200
                      pattern: '^/[-A-Za-z0-9._~/%]*$'
                      description: HTTP path on the service's port, such as /healthz.
                metrics:
                  type: object
                  description: >-
                    Prometheus metrics the container serves. When set, Prometheus
                    scrapes them and they appear on the service's Grafana dashboard.
                  properties:
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      description: Port that serves metrics. Defaults to the service's port.
                    path:
                      type: string
                      default: /metrics
                database:
                  type: object
                  description: >-
                    A PostgreSQL database for the service. The container gets
                    PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD and PGSSLMODE,
                    and on Kubernetes also DATABASE_URL.
                  required: [class]
                  properties:
                    class:
                      type: string
                      enum: [managed, in-cluster]
                      description: >-
                        managed: a database and login on the platform's shared
                        Postgres server (RDS on AWS). in-cluster: a CloudNativePG
                        Postgres cluster next to the service, Kubernetes runtime only.
            status:
              type: object
              properties:
                url:
                  type: string
                  description: Public URL, when spec.public is true.
                database:
                  type: object
                  properties:
                    host:
                      type: string
                    name:
                      type: string
                    secretName:
                      type: string
                      description: Kubernetes Secret that holds the database login.
