apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: webservice
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: WebService
  mode: Pipeline
  pipeline:
    # Shared platform settings, such as the public domain, and account-specific
    # AWS settings, such as subnets and the ECS cluster.
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform
            - type: Reference
              ref:
                name: aws-platform
          policy:
            resolution: Optional

    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $runtime := default "kubernetes" $xr.spec.runtime }}
            {{- $env := default dict (index .context "apiextensions.crossplane.io/environment") }}
            {{- /* Lets Backstage's Kubernetes plugin find everything this WebService creates. */}}
            {{- $backstageId := printf "%s-%s" $ns $name }}
            {{- if eq $runtime "kubernetes" }}
            {{- $available := dig "deployment" "resource" "status" "availableReplicas" 0 (default dict .observed.resources) }}
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              labels:
                backstage.io/kubernetes-id: {{ $backstageId }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
                gotemplating.fn.crossplane.io/ready: {{ if ge (int $available) (int $xr.spec.replicas) }}"True"{{ else }}"False"{{ end }}
            spec:
              replicas: {{ $xr.spec.replicas }}
              selector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: {{ $name }}
                    backstage.io/kubernetes-id: {{ $backstageId }}
                spec:
                  containers:
                    - name: app
                      image: {{ $xr.spec.image }}
                      ports:
                        - containerPort: {{ $xr.spec.port }}
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              labels:
                backstage.io/kubernetes-id: {{ $backstageId }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app.kubernetes.io/name: {{ $name }}
              ports:
                - port: 80
                  targetPort: {{ $xr.spec.port }}
            {{- if $xr.spec.public }}
            {{- $platform := dig "platform" dict $env }}
            {{- if not (and $platform.domain $platform.gateway) }}{{ fail "public WebServices need platform.domain and platform.gateway in the platform EnvironmentConfig" }}{{ end }}
            {{- /* One label under the domain, so the wildcard certificate covers it. */}}
            {{- $host := printf "%s-%s.%s" $name $ns $platform.domain }}
            ---
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: {{ $name }}
              labels:
                backstage.io/kubernetes-id: {{ $backstageId }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: route
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              parentRefs:
                - name: {{ $platform.gateway.name }}
                  namespace: {{ $platform.gateway.namespace }}
                  sectionName: {{ $platform.gateway.sectionName }}
              hostnames:
                - {{ $host }}
              rules:
                - backendRefs:
                    - name: {{ $name }}
                      port: 80
            ---
            apiVersion: platform.example.org/v1alpha1
            kind: WebService
            status:
              url: https://{{ $host }}
            {{- end }}
            {{- else if eq $runtime "ecs" }}
            {{- if $xr.spec.public }}{{ fail "public URLs are only available for the kubernetes runtime for now" }}{{ end }}
            {{- $aws := dig "aws" dict $env }}
            {{- range $key := list "region" "ecsClusterName" "vpcId" "vpcCidr" "subnetIds" "taskExecutionRoleArn" }}
            {{- if not (hasKey $aws $key) }}{{ fail (printf "the ECS runtime needs aws.%s in the aws-platform EnvironmentConfig" $key) }}{{ end }}
            {{- end }}
            {{- $awsName := printf "idp-%s-%s" $ns $name }}
            {{- $logGroup := printf "/idp/%s/%s" $ns $name }}
            {{- $container := dict "name" "app" "image" $xr.spec.image "essential" true
                  "portMappings" (list (dict "containerPort" $xr.spec.port "protocol" "tcp"))
                  "logConfiguration" (dict "logDriver" "awslogs" "options" (dict "awslogs-group" $logGroup "awslogs-region" $aws.region "awslogs-stream-prefix" "app")) }}
            apiVersion: cloudwatchlogs.aws.m.upbound.io/v1beta1
            kind: Group
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: log-group
                crossplane.io/external-name: {{ $logGroup }}
            spec:
              forProvider:
                region: {{ $aws.region }}
                retentionInDays: 7
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroup
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: security-group
            spec:
              forProvider:
                region: {{ $aws.region }}
                name: {{ $awsName }}
                description: {{ printf "WebService %s/%s" $ns $name | quote }}
                vpcId: {{ $aws.vpcId }}
            ---
            # Only traffic from inside the VPC can reach the service.
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupIngressRule
            metadata:
              name: {{ $name }}-ingress
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ingress-rule
            spec:
              forProvider:
                region: {{ $aws.region }}
                securityGroupIdRef:
                  name: {{ $name }}
                cidrIpv4: {{ $aws.vpcCidr }}
                ipProtocol: tcp
                fromPort: {{ $xr.spec.port }}
                toPort: {{ $xr.spec.port }}
            ---
            # Tasks need outbound access to pull images and send logs.
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupEgressRule
            metadata:
              name: {{ $name }}-egress
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: egress-rule
            spec:
              forProvider:
                region: {{ $aws.region }}
                securityGroupIdRef:
                  name: {{ $name }}
                cidrIpv4: 0.0.0.0/0
                ipProtocol: "-1"
            ---
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: TaskDefinition
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: task-definition
            spec:
              forProvider:
                region: {{ $aws.region }}
                family: {{ $awsName }}
                cpu: "256"
                memory: "512"
                networkMode: awsvpc
                requiresCompatibilities: [FARGATE]
                executionRoleArn: {{ $aws.taskExecutionRoleArn }}
                containerDefinitions: {{ list $container | toJson | toJson }}
            ---
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: Service
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ecs-service
                crossplane.io/external-name: {{ $awsName }}
            spec:
              forProvider:
                region: {{ $aws.region }}
                # The provider builds the service ID from this, so it must be the name, not the ARN.
                cluster: {{ $aws.ecsClusterName }}
                launchType: FARGATE
                desiredCount: {{ $xr.spec.replicas }}
                taskDefinitionRef:
                  name: {{ $name }}
                networkConfiguration:
                  subnets: {{ $aws.subnetIds | toJson }}
                  securityGroupRefs:
                    - name: {{ $name }}
                  assignPublicIp: false
                deploymentCircuitBreaker:
                  enable: true
                  rollback: true
            {{- end }}

    # Marks AWS resources ready once they report Ready. Kubernetes resources set their readiness above.
    - step: ready
      functionRef:
        name: function-auto-ready
