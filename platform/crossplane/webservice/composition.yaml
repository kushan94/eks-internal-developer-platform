apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: webservice
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: WebService
  mode: Pipeline
  pipeline:
    # Shared platform settings, such as the public domain, account-specific
    # AWS settings, such as subnets and the ECS cluster, and the shared Postgres server.
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform
            - type: Reference
              ref:
                name: aws-platform
            - type: Reference
              ref:
                name: managed-postgres
          policy:
            resolution: Optional

    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $runtime := default "kubernetes" $xr.spec.runtime }}
            {{- $env := default dict (index .context "apiextensions.crossplane.io/environment") }}
            {{- /* Lets Backstage's Kubernetes plugin find everything this WebService creates. */}}
            {{- $backstageId := printf "%s-%s" $ns $name }}
            {{- $url := "" }}
            {{- /* Database: the same PG* variables for both classes, so apps don't care which they get. */}}
            {{- $dbClass := dig "database" "class" "" $xr.spec }}
            {{- $dbSecret := "" }}
            {{- $dbName := "" }}
            {{- $dbHost := "" }}
            {{- $pg := dig "managedPostgres" dict $env }}
            {{- if eq $dbClass "in-cluster" }}
            {{- if ne $runtime "kubernetes" }}{{ fail "in-cluster databases are only available for the kubernetes runtime; use class: managed on ECS" }}{{ end }}
            {{- /* CloudNativePG creates the app database and writes its login to <cluster>-app. */}}
            {{- $dbSecret = printf "%s-db-app" $name }}
            {{- $dbName = "app" }}
            {{- $dbHost = printf "%s-db-rw.%s.svc" $name $ns }}
            {{- else if eq $dbClass "managed" }}
            {{- range $key := list "providerConfigName" "host" "port" "adminRole" }}
            {{- if not (hasKey $pg $key) }}{{ fail (printf "managed databases need managedPostgres.%s in the managed-postgres or aws-platform EnvironmentConfig" $key) }}{{ end }}
            {{- end }}
            {{- /* One database and login per service on the shared server, named after its namespace. */}}
            {{- $dbName = $backstageId }}
            {{- if gt (len $dbName) 63 }}{{ fail (printf "the database name %s is longer than Postgres' 63 characters; shorten the namespace or name" $dbName) }}{{ end }}
            {{- $dbSecret = printf "%s-db" $name }}
            {{- $dbHost = $pg.host }}
            {{- end }}
            {{- if eq $runtime "kubernetes" }}
            {{- $available := dig "deployment" "resource" "status" "availableReplicas" 0 (default dict .observed.resources) }}
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              labels:
                backstage.io/kubernetes-id: {{ $backstageId }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
                gotemplating.fn.crossplane.io/ready: {{ if ge (int $available) (int $xr.spec.replicas) }}"True"{{ else }}"False"{{ end }}
            spec:
              replicas: {{ $xr.spec.replicas }}
              selector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: {{ $name }}
                    backstage.io/kubernetes-id: {{ $backstageId }}
                spec:
                  containers:
                    - name: app
                      image: {{ $xr.spec.image }}
                      ports:
                        - containerPort: {{ $xr.spec.port }}
                      {{- if $dbClass }}
                      env:
                        {{- if eq $dbClass "in-cluster" }}
                        - name: PGHOST
                          valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: host}}
                        - name: PGPORT
                          valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: port}}
                        {{- else }}
                        - name: PGHOST
                          value: {{ $pg.host | quote }}
                        - name: PGPORT
                          value: {{ $pg.port | toString | quote }}
                        {{- end }}
                        - name: PGDATABASE
                          value: {{ $dbName | quote }}
                        - name: PGUSER
                          valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: username}}
                        - name: PGPASSWORD
                          valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: password}}
                        - name: PGSSLMODE
                          value: require
                        # Generated passwords are letters and digits, so they need no URL encoding.
                        - name: DATABASE_URL
                          value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=require
                      {{- end }}
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              labels:
                backstage.io/kubernetes-id: {{ $backstageId }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app.kubernetes.io/name: {{ $name }}
              ports:
                - port: 80
                  targetPort: {{ $xr.spec.port }}
            {{- if $xr.spec.public }}
            {{- $platform := dig "platform" dict $env }}
            {{- if not (and $platform.domain $platform.gateway) }}{{ fail "public WebServices need platform.domain and platform.gateway in the platform EnvironmentConfig" }}{{ end }}
            {{- /* One label under the domain, so the wildcard certificate covers it. */}}
            {{- $host := printf "%s-%s.%s" $name $ns $platform.domain }}
            ---
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: {{ $name }}
              labels:
                backstage.io/kubernetes-id: {{ $backstageId }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: route
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              parentRefs:
                - name: {{ $platform.gateway.name }}
                  namespace: {{ $platform.gateway.namespace }}
                  sectionName: {{ $platform.gateway.sectionName }}
              hostnames:
                - {{ $host }}
              rules:
                - backendRefs:
                    - name: {{ $name }}
                      port: 80
            {{- $url = printf "https://%s" $host }}
            {{- end }}
            {{- else if eq $runtime "ecs" }}
            {{- if $xr.spec.public }}{{ fail "public URLs are only available for the kubernetes runtime for now" }}{{ end }}
            {{- $aws := dig "aws" dict $env }}
            {{- range $key := list "region" "ecsClusterName" "vpcId" "vpcCidr" "subnetIds" "taskExecutionRoleArn" }}
            {{- if not (hasKey $aws $key) }}{{ fail (printf "the ECS runtime needs aws.%s in the aws-platform EnvironmentConfig" $key) }}{{ end }}
            {{- end }}
            {{- $awsName := printf "idp-%s-%s" $ns $name }}
            {{- $logGroup := printf "/idp/%s/%s" $ns $name }}
            {{- $container := dict "name" "app" "image" $xr.spec.image "essential" true
                  "portMappings" (list (dict "containerPort" $xr.spec.port "protocol" "tcp"))
                  "logConfiguration" (dict "logDriver" "awslogs" "options" (dict "awslogs-group" $logGroup "awslogs-region" $aws.region "awslogs-stream-prefix" "app")) }}
            {{- /* The task definition waits for the database password to reach Secrets Manager. */}}
            {{- $dbSecretArn := dig "db-secret" "resource" "status" "atProvider" "arn" "" (default dict .observed.resources) }}
            {{- $dbPasswordStored := dig "db-secret-version" "resource" "status" "atProvider" "id" "" (default dict .observed.resources) }}
            {{- $renderTask := or (ne $dbClass "managed") (and $dbSecretArn $dbPasswordStored) }}
            {{- if eq $dbClass "managed" }}
            {{- $_ := set $container "environment" (list
                  (dict "name" "PGHOST" "value" $pg.host)
                  (dict "name" "PGPORT" "value" ($pg.port | toString))
                  (dict "name" "PGDATABASE" "value" $dbName)
                  (dict "name" "PGUSER" "value" $dbName)
                  (dict "name" "PGSSLMODE" "value" "require")) }}
            {{- $_ := set $container "secrets" (list (dict "name" "PGPASSWORD" "valueFrom" $dbSecretArn)) }}
            {{- end }}
            apiVersion: cloudwatchlogs.aws.m.upbound.io/v1beta1
            kind: Group
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: log-group
                crossplane.io/external-name: {{ $logGroup }}
            spec:
              forProvider:
                region: {{ $aws.region }}
                retentionInDays: 7
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroup
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: security-group
            spec:
              forProvider:
                region: {{ $aws.region }}
                name: {{ $awsName }}
                description: {{ printf "WebService %s/%s" $ns $name | quote }}
                vpcId: {{ $aws.vpcId }}
            ---
            # Only traffic from inside the VPC can reach the service.
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupIngressRule
            metadata:
              name: {{ $name }}-ingress
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ingress-rule
            spec:
              forProvider:
                region: {{ $aws.region }}
                securityGroupIdRef:
                  name: {{ $name }}
                cidrIpv4: {{ $aws.vpcCidr }}
                ipProtocol: tcp
                fromPort: {{ $xr.spec.port }}
                toPort: {{ $xr.spec.port }}
            ---
            # Tasks need outbound access to pull images and send logs.
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupEgressRule
            metadata:
              name: {{ $name }}-egress
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: egress-rule
            spec:
              forProvider:
                region: {{ $aws.region }}
                securityGroupIdRef:
                  name: {{ $name }}
                cidrIpv4: 0.0.0.0/0
                ipProtocol: "-1"
            {{- if $renderTask }}
            ---
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: TaskDefinition
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: task-definition
            spec:
              forProvider:
                region: {{ $aws.region }}
                family: {{ $awsName }}
                cpu: "256"
                memory: "512"
                networkMode: awsvpc
                requiresCompatibilities: [FARGATE]
                executionRoleArn: {{ $aws.taskExecutionRoleArn }}
                containerDefinitions: {{ list $container | toJson | toJson }}
            ---
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: Service
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ecs-service
                crossplane.io/external-name: {{ $awsName }}
            spec:
              forProvider:
                region: {{ $aws.region }}
                # The provider builds the service ID from this, so it must be the name, not the ARN.
                cluster: {{ $aws.ecsClusterName }}
                launchType: FARGATE
                desiredCount: {{ $xr.spec.replicas }}
                taskDefinitionRef:
                  name: {{ $name }}
                networkConfiguration:
                  subnets: {{ $aws.subnetIds | toJson }}
                  securityGroupRefs:
                    - name: {{ $name }}
                  assignPublicIp: false
                deploymentCircuitBreaker:
                  enable: true
                  rollback: true
            {{- end }}
            {{- if eq $dbClass "managed" }}
            ---
            # ECS reads secrets from Secrets Manager, so the password is copied there.
            apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
            kind: Secret
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-secret
            spec:
              forProvider:
                region: {{ $aws.region }}
                name: {{ printf "idp/workloads/%s/%s/database" $ns $name }}
                description: {{ printf "Database password for WebService %s/%s" $ns $name | quote }}
                recoveryWindowInDays: 0
            ---
            apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
            kind: SecretVersion
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-secret-version
            spec:
              forProvider:
                region: {{ $aws.region }}
                secretIdRef:
                  name: {{ $name }}-db
                secretStringSecretRef:
                  name: {{ $dbSecret }}
                  key: password
            {{- end }}
            {{- end }}
            {{- if eq $dbClass "in-cluster" }}
            {{- $readyInstances := dig "database" "resource" "status" "readyInstances" 0 (default dict .observed.resources) }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ $name }}-db
              labels:
                backstage.io/kubernetes-id: {{ $backstageId }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
                gotemplating.fn.crossplane.io/ready: {{ if ge (int $readyInstances) 1 }}"True"{{ else }}"False"{{ end }}
            spec:
              instances: 1
              # Shows the database pods on the service's Kubernetes tab in Backstage.
              inheritedMetadata:
                labels:
                  backstage.io/kubernetes-id: {{ $backstageId }}
              storage:
                size: 1Gi
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
            {{- else if eq $dbClass "managed" }}
            {{- $providerConfigRef := dict "kind" "ClusterProviderConfig" "name" $pg.providerConfigName }}
            ---
            # A login for the service. provider-sql generates its password and
            # writes it, with the username, to the {{ $dbSecret }} Secret.
            apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
            kind: Role
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-role
                crossplane.io/external-name: {{ $dbName }}
            spec:
              providerConfigRef: {{ $providerConfigRef | toJson }}
              forProvider:
                privileges:
                  login: true
              writeConnectionSecretToRef:
                name: {{ $dbSecret }}
            ---
            # RDS's admin isn't a superuser, so it must be a member of the role
            # to create a database owned by it.
            apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              name: {{ $name }}-db-admin
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-admin-membership
            spec:
              providerConfigRef: {{ $providerConfigRef | toJson }}
              forProvider:
                role: {{ $pg.adminRole }}
                memberOf: {{ $dbName }}
            ---
            # Owned by the service's login, which can then create its own tables.
            apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
            kind: Database
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-database
                crossplane.io/external-name: {{ $dbName }}
            spec:
              providerConfigRef: {{ $providerConfigRef | toJson }}
              forProvider:
                owner: {{ $dbName }}
            ---
            # Other services' logins can't connect to this database.
            apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              name: {{ $name }}-db-connect
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-connect
            spec:
              providerConfigRef: {{ $providerConfigRef | toJson }}
              forProvider:
                privileges: [CONNECT]
                database: {{ $dbName }}
                role: {{ $dbName }}
                revokePublicOnDb: true
            {{- end }}
            {{- if or $url $dbClass }}
            ---
            apiVersion: platform.example.org/v1alpha1
            kind: WebService
            status:
              {{- if $url }}
              url: {{ $url }}
              {{- end }}
              {{- if $dbClass }}
              database:
                host: {{ $dbHost }}
                name: {{ $dbName }}
                secretName: {{ $dbSecret }}
              {{- end }}
            {{- end }}

    # Marks AWS resources ready once they report Ready. Kubernetes resources set their readiness above.
    - step: ready
      functionRef:
        name: function-auto-ready
