# Example only. The real values identify your AWS account, so the real file is
# generated from Terraform outputs and applied directly, not committed.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: aws-platform
data:
  aws:
    region: eu-west-1
    ecsClusterName: idp
    vpcId: vpc-0123456789abcdef0
    vpcCidr: 10.42.0.0/16
    subnetIds:
      - subnet-0123456789abcdef0
      - subnet-0fedcba9876543210
    taskExecutionRoleArn: arn:aws:iam::111122223333:role/idp-ecs-task-execution
    publicSubnetCidrs:
      - 10.42.128.0/20
      - 10.42.144.0/20
  # true with Terraform's production profile: in-cluster databases run three instances.
  highAvailability: false
  # Only on EKS: the shared RDS instance for managed databases.
  managedPostgres:
    providerConfigName: shared-postgres
    host: idp-shared-postgres.abcdefghijkl.eu-west-1.rds.amazonaws.com
    port: 5432
    adminRole: idpadmin
