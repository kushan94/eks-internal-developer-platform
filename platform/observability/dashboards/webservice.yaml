# The WebService dashboard. Grafana's sidecar loads ConfigMaps with the
# grafana_dashboard label. Pods are matched to a service by their
# backstage.io/kubernetes-id label, which kube-state-metrics exports.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-webservice
  labels:
    grafana_dashboard: "1"
data:
  webservice.json: |
    {
      "uid": "webservice",
      "title": "WebService",
      "tags": [
        "platform"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "description": "One dashboard for any WebService. Pick the service by its Backstage ID, namespace-name.",
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_pod_labels{label_backstage_io_kubernetes_id!=\"\"}, label_backstage_io_kubernetes_id)",
              "refId": "service"
            },
            "definition": "label_values(kube_pod_labels{label_backstage_io_kubernetes_id!=\"\"}, label_backstage_io_kubernetes_id)",
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false
          },
          {
            "name": "environment",
            "label": "Environment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\"}, label_platform_example_org_environment)",
              "refId": "environment"
            },
            "definition": "label_values(kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\"}, label_platform_example_org_environment)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "multi": false,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Running pods",
          "description": "Pods of this service in the Running phase, including its in-cluster database.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count((kube_pod_status_phase{phase=\"Running\"} == 1) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"})",
              "instant": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Restarts (24h)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total[24h]) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"}) or vector(0)",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Memory",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum((container_memory_working_set_bytes{container!=\"\", container!=\"POD\"}) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"})",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Metrics scraped",
          "description": "Share of the service's metrics endpoints Prometheus can reach. Empty when the WebService doesn't set metrics.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum((up) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"}) / count((up) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"})",
              "instant": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU by pod",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{container!=\"\", container!=\"POD\"}[5m]) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory by pod",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) ((container_memory_working_set_bytes{container!=\"\", container!=\"POD\"}) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Network received by pod",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total[5m]) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Restarts by container",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total[1h]) and on(namespace, pod) kube_pod_labels{label_backstage_io_kubernetes_id=\"$service\", label_platform_example_org_environment=~\"$environment\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Logs",
          "description": "The service's container logs, including its in-cluster database, from Loki.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{service=\"$service\", environment=~\"$environment\"}"
            }
          ]
        }
      ]
    }
