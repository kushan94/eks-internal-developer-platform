# Grafana Alloy's pipeline: tail every container's log file on the node,
# label each line with its namespace, pod, container and WebService, and
# send it to Loki. The service label is the backstage.io/kubernetes-id pod
# label, the same one the WebService dashboard selects on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    // Only this node's pods; Alloy runs on every node.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_backstage_io_kubernetes_id"]
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_platform_example_org_environment"]
        target_label  = "environment"
      }
      // The kubelet writes to /var/log/pods/<namespace>_<pod>_<uid>/<container>/.
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    // Unwraps the container runtime's log format, keeping the original time,
    // and drops the file path label, which would start a new stream every
    // time a container restarts.
    loki.process "pods" {
      stage.cri {}
      stage.label_drop {
        values = ["filename"]
      }
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
    }
