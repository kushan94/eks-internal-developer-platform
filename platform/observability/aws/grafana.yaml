# EKS only: Grafana at grafana.idp.skyforgelab.cloud through the shared
# Gateway, with GitHub login. The GitHub OAuth app's credentials live in
# Secrets Manager (idp/grafana/github-oauth) and are never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-github-oauth
    template:
      data:
        GF_AUTH_GITHUB_CLIENT_ID: "{{ .clientId }}"
        GF_AUTH_GITHUB_CLIENT_SECRET: "{{ .clientSecret }}"
  dataFrom:
    - extract:
        key: idp/grafana/github-oauth
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
# Written with the fields the API server would default, so Argo CD's
# comparison matches the live object.
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: gateway-system
      sectionName: https
  hostnames:
    - grafana.idp.skyforgelab.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
