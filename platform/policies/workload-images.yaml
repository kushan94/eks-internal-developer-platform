# Rules for the images teams run. They apply to workload namespaces, which
# Argo CD labels platform.example.org/workload=true when it creates them.
# Autogen also checks Deployments, so a WebService with a rejected image
# reports the reason in its Synced condition instead of failing silently.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/description: >-
      Images need a version tag or digest. :latest, or no tag at all, changes
      under you and can't be rolled back.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.example.org/workload: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image) +
        (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
    - name: unpinned
      expression: variables.images.filter(i, !image(i).containsDigest() && image(i).tag() == 'latest')
  validations:
    - expression: size(variables.unpinned) == 0
      messageExpression: >-
        'use a version tag or digest instead of :latest or no tag: ' + variables.unpinned.join(', ')
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: allowed-registries
  annotations:
    policies.kyverno.io/description: >-
      Images come only from registries and organizations the platform trusts.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.example.org/workload: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image) +
        (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
    # Docker Hub images without a registry are index.docker.io.
    - name: allowed
      expression: >-
        ['ghcr.io/kushan94/', 'ghcr.io/stefanprodan/', 'ghcr.io/cloudnative-pg/', 'index.docker.io/nginxinc/']
    - name: rejected
      expression: >-
        variables.images.filter(i, !variables.allowed.exists(p,
          (image(i).registry() + '/' + image(i).repository()).startsWith(p)))
  validations:
    - expression: size(variables.rejected) == 0
      messageExpression: >-
        'images must come from ' + variables.allowed.join(', ') + '; not allowed: ' + variables.rejected.join(', ')
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/description: >-
      Containers set CPU and memory requests and a memory limit, so one
      service can't starve the others. WebServices get these by default.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.example.org/workload: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments]
  variables:
    - name: missing
      expression: >-
        object.spec.containers.filter(c, !(has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)).map(c, c.name)
  validations:
    - expression: size(variables.missing) == 0
      messageExpression: >-
        'containers need CPU and memory requests and a memory limit: ' + variables.missing.join(', ')
