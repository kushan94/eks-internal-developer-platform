# The platform's own images (ghcr.io/kushan94/... and the private ECR
# repositories idp-apps/...) must be signed by one of this repo's GitHub Actions
# workflows on main, which includes app-deploy.yml when an app repo calls it.
# Signing is keyless: the workflow's GitHub identity is recorded in Sigstore's
# public transparency log, so there are no signing keys to store or rotate.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-platform-images
spec:
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.example.org/workload: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments]
  matchImageReferences:
    - glob: ghcr.io/kushan94/*
    - glob: '*.dkr.ecr.eu-north-1.amazonaws.com/idp-apps/*'
  # Reads signatures from private ECR with the admission controller's Pod
  # Identity role (infra/terraform/kyverno.tf).
  credentials:
    providers: [amazon]
  validationConfigurations:
    # Tags stay as written, so Crossplane and Argo CD don't see drift.
    mutateDigest: false
    verifyDigest: false
    required: true
  attestors:
    - name: platformCI
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/kushan94/eks-internal-developer-platform/\.github/workflows/[^/]+\.yml@refs/heads/main$'
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.filter(i, i.startsWith('ghcr.io/kushan94/') || i.contains('.dkr.ecr.eu-north-1.amazonaws.com/idp-apps/'))
          .all(i, verifyImageSignatures(i, [attestors.platformCI]) > 0)
      message: >-
        ghcr.io/kushan94 and idp-apps/ ECR images must be signed by a GitHub Actions workflow in
        kushan94/eks-internal-developer-platform on main
