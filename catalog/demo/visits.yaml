apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: demo-visits
  title: visits
  description: Database demo. Counts page views in a managed Postgres database.
  annotations:
    github.com/project-slug: kushan94/eks-internal-developer-platform
    backstage.io/source-location: url:https://github.com/kushan94/eks-internal-developer-platform/tree/main/apps/visits
    # One Argo CD app per environment, labelled with the service's ID.
    argocd/app-selector: backstage.io/kubernetes-id=demo-visits
    platform.example.org/runtime: kubernetes
    # Matches the pods of every environment, in demo-dev, demo-staging and demo-prod.
    backstage.io/kubernetes-id: demo-visits
  links:
    - url: https://visits-demo-prod.idp.skyforgelab.cloud
      title: Open prod
    - url: https://visits-demo-staging.idp.skyforgelab.cloud
      title: Open staging
    - url: https://visits-demo-dev.idp.skyforgelab.cloud
      title: Open dev
    - url: https://grafana.idp.skyforgelab.cloud/d/webservice/webservice?var-service=demo-visits
      title: Dashboard
      icon: dashboard
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: idp-services
  dependsOn:
    - resource:default/eks-cluster
    - resource:default/shared-postgres
